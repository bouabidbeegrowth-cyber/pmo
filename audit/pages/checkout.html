.payment-section {
    padding: 48px 0;
}
.payment-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}
.payment-header {
    padding: 24px;
    background-color: var(--indigo-500);
    border-radius: 12px;
    padding-bottom: 72px;
}
.payment-header-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: var(--indigo-600);
    color: var(--white);
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}
.payment-header-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.4;
    margin-bottom: 4px;
}
.payment-header-description {
    font-size: 15px;
    color: var(--gray-200);
    line-height: 1.5;
}
.payment-content {
    padding: 24px;
    margin-top: -64px;
    position: relative;
}
.payment-content::before {
    content: '';
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    height: 16px;
    border-radius: 4px;
    background-color: var(--indigo-600);
}
.payment-body {
    background-color: var(--white);
    border-radius: 0 0 8px 8px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .05), inset 0 8px 0 rgba(0, 0, 0, .05);
    position: relative;
    padding-top: 8px;
    overflow: hidden;
}
.payment-plan {
    display: flex;
    align-items: center;
    padding: 12px;
}
.payment-plan-type {
    width: 40px;
    height: 40px;
    background-color: var(--indigo-500);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    margin-right: 8px;
}
.payment-plan-info {
    width: 100%;
    margin-right: 8px;
    display: grid;
}
.payment-plan-info-name {
    font-size: 13px;
    color: var(--gray-400);
    margin-bottom: 2px;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}
.payment-plan-info-price {
    font-weight: 600;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
}
.payment-plan-change {
    color: var(--blue-500);
    font-size: 12px;
    font-weight: 600;
    text-underline-offset: 2px;
}
.payment-plan-change:hover {
    color: var(--blue-600);
}
.payment-summary-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
}
.payment-summary-name {
    font-size: 14px;
    color: var(--gray-500);
}
.payment-summary-price {
    font-weight: 500;
    font-size: 15px;
}
.payment-summary-divider {
    width: calc(100% - 16px);
    height: 0;
    margin: 12px auto;
    border-bottom: 1px dashed var(--gray-200);
    position: relative;
}
.payment-summary-divider::before {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    right: 100%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: var(--gray-50);
    box-shadow: inset 0 2px 16px rgba(0, 0, 0, .05);
}
.payment-summary-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 100%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background-color: var(--gray-50);
    box-shadow: inset 0 2px 16px rgba(0, 0, 0, .05);
}
.payment-summary-total {
    padding-bottom: 16px;
}
.payment-summary-total .payment-summary-name {
    color: var(--gray-900);
}
.payment-summary-total .payment-summary-price {
    font-size: 16px;
    color: var(--indigo-500);
    font-weight: 600;
}
.payment-right {
    min-width: 0;
}
.payment-form {

    background-color: var(--white);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .05);

.payment-form-group {
    position: relative;
    margin-bottom: 16px;
}
.payment-form-control {
    outline: transparent;
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    padding: 24px 16px 8px 16px;
    width: 100%;
    transition: all .15s ease-in-out;
}
.payment-form-label {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 16px;
    color: var(--gray-400);
    pointer-events: none;
    transition: all .1s ease-in-out;
}
.payment-form-control:focus {
    outline: 1px solid var(--indigo-500);
    border-color: var(--indigo-500);
}
.payment-form-control:focus + .payment-form-label,
.payment-form-control:not(:placeholder-shown) + .payment-form-label {
    top: 30%;
    font-size: 12px;
}
.payment-form-label-required::after {
    content: ' *';
    color: var(--red-500);
}
.payment-form-group-flex {
    display: flex;
    align-items: center;
}
.payment-form-group-flex > * {
    width: 100%;
}
.payment-form-group-flex > :not(:last-child) {
    margin-right: 12px;
}
.payment-form-submit-button {
    background-color: var(--indigo-500);
    border-radius: 8px;
    outline: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    border: none;
    cursor: pointer;
    color: var(--white);
    font-weight: 600;
    padding: 16px;
    transition: all .15s ease-in-out;
}
.payment-form-submit-button:hover {
    background-color: var(--indigo-600);
}
.payment-form-submit-button > i {
    margin-right: 8px;
}

<script>
    function submitForm(action) {
        const form = document.getElementById('passForm');
        const quantites = document.querySelectorAll('input[name="pass_quantite[]"]');
        let totalPass = 0;

        // Calculer le total des passes sélectionnés
        quantites.forEach(input => {
            totalPass += parseInt(input.value) || 0;
        });

        // Valider le formulaire HTML5 (champs requis, etc.)
        if (!form.checkValidity()) {
            form.reportValidity(); // afficher les erreurs natives
            return;
        }

        // Vérifier qu'au moins un pass est sélectionné sauf si l'action est inscription.php
        // (si tu veux que inscription.php passe même avec totalPass = 0)
        if (action !== 'inscription.php' && totalPass === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Pass manquant',
                text: 'Vous devez sélectionner au moins un pass.',
                confirmButtonText: 'OK'
            });
            return;
        }

        // Mettre à jour l'action du formulaire et soumettre
        form.action = action;
        form.submit();
    }
</script>

    <script>
document.addEventListener('DOMContentLoaded', function () {
    const totalInput = document.getElementById('total-commande');

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('.card-radio').forEach(card => {
            const quantityInput = card.querySelector('.quantity-input');
            const quantity = parseInt(quantityInput.value) || 0;
            const price = parseFloat(card.dataset.price) || 0;

            total += price * quantity;
        });

        totalInput.value = (total + (total * 0.19)).toFixed(2) + ' TND';
    }

    document.querySelectorAll('.quantity-selector').forEach(selector => {
        const minusBtn = selector.querySelector('.minus-btn');
        const plusBtn = selector.querySelector('.plus-btn');
        const quantityInput = selector.querySelector('.quantity-input');
        const card = selector.closest('.card-radio');
        const isEquipe = parseFloat(card.dataset.price) === 450;

        if (isEquipe) {
            plusBtn.dataset.firstClick = 'true';
        }

        minusBtn.addEventListener('click', function () {
            let current = parseInt(quantityInput.value) || 0;
            if (isEquipe) {
                if (current === 2) {
                    quantityInput.value = 0;
                    plusBtn.dataset.firstClick = 'true';
                } else if (current > 0) {
                    quantityInput.value = current - 1;
                }
            } else if (current > 0) {
                quantityInput.value = current - 1;
            }
            calculateTotal();

            if (isEquipe) {
                const val = parseInt(quantityInput.value) || 0;
                const warningMessage = card.querySelector('.warning-message');
                warningMessage.style.display = val === 1 ? 'block' : 'none';
            }
        });

        plusBtn.addEventListener('click', function () {
            let current = parseInt(quantityInput.value) || 0;
            if (isEquipe) {
                if (plusBtn.dataset.firstClick === 'true' && current === 0) {
                    quantityInput.value = 2;
                    plusBtn.dataset.firstClick = 'false';
                } else {
                    quantityInput.value = current + 1;
                }
            } else {
                quantityInput.value = current + 1;
            }
            calculateTotal();

            if (isEquipe) {
                const val = parseInt(quantityInput.value) || 0;
                const warningMessage = card.querySelector('.warning-message');
                warningMessage.style.display = val === 1 ? 'block' : 'none';
            }
        });

        quantityInput.addEventListener('input', function () {
            const val = parseInt(quantityInput.value) || 0;
            if (isEquipe && val === 0) {
                plusBtn.dataset.firstClick = 'true';
            }
            calculateTotal();

            if (isEquipe) {
                const warningMessage = card.querySelector('.warning-message');
                warningMessage.style.display = val === 1 ? 'block' : 'none';
            }
        });
    });

    calculateTotal(); // initial calc au chargement
});

        <script>
            // Affiche ou masque le champ code promo selon la checkbox
            document.getElementById('hasPromoCode').addEventListener('change', function () {
                const promoSection = document.getElementById('promoCodeSection');
                promoSection.style.display = this.checked ? 'block' : 'none';
            });

            // Fonction de vérification du code promo (à adapter avec votre logique serveur)
            function checkPromoCode() {
                const code = document.getElementById('codePromoInput').value.trim();
                const feedback = document.getElementById('promoFeedback');
                const totalElement = document.getElementById('total-commande');

                if (code === '') {
                    feedback.textContent = 'Veuillez entrer un code promo.';
                    feedback.style.color = 'red';
                    return;
                }

                // Récupère le prix initial
                const prixInitial = parseFloat(totalElement.value.replace(/[^\d.]/g, ''));
                fetch('check_code.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'code_promo=' + encodeURIComponent(code)
                })
                    .then(response => response.text())
                    .then(data => {
                        if (data.includes('appliquée')) {
                            // ✅ Essayer d'extraire la remise depuis le message retourné
                            const match = data.match(/Remise de (\d+(?:\.\d+)?)%/);
                            if (match) {
                                const remise = parseFloat(match[1]);
                                const prixRemise = prixInitial - (prixInitial * (remise / 100));
                                feedback.style.color = 'green';
                                feedback.textContent = data + ` Nouveau total : ${prixRemise.toFixed(3)} TND`;
                            } else {
                                feedback.style.color = 'green';
                                feedback.textContent = data;
                            }
                        } else {
                            feedback.style.color = 'red';
                            feedback.textContent = data;
                        }
                    })
                    .catch(error => {
                        feedback.textContent = 'Erreur serveur.';
                        feedback.style.color = 'red';
                    });
            }

        </script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const selected = localStorage.getItem('selectPass');

    if (selected) {
        // Reset all quantities
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.value = 0;
        });

        // Normalize and match
        document.querySelectorAll('.card-radio').forEach(card => {
            const label = card.querySelector('.card-details span');
            if (label) {
                const text = label.textContent.trim()
                  .toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                const selectedNormalized = selected
                  .toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                if (text.includes(selectedNormalized)) {
                    const quantityInput = card.querySelector('.quantity-input');
                    if (quantityInput) {
                        quantityInput.value = 1;
                    }

                    // Optional: highlight
                    card.classList.add('border', 'border-success');
                }
            }
        });

        // Clean up
        localStorage.removeItem('selectPass');

        // Trigger recalculation
        const event = new Event('input');
        document.querySelectorAll('.quantity-input').forEach(input => {
            input.dispatchEvent(event);
        });
    }
});
</script>
